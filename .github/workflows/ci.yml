name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [orchestrator, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Check for go.mod
        id: check
        run: |
          if [ -f "${{ matrix.module }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version: "1.23"

      - name: Build, vet, test with coverage
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Skip (no go.mod yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No go.mod in ${{ matrix.module }}/ yet — skipping."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, build, test with coverage
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test -- --coverage

      - name: Skip (no package.json yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No package.json in frontend/ yet — skipping."
