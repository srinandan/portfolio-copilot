name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify schema sync
        run: ./scripts/sync-schemas.sh --check

      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 gcr.io/google.com/cloudsdktool/cloud-sdk gcloud emulators firestore start --host-port=0.0.0.0:8080
          sleep 5

      - name: Build, vet, test with coverage
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
        run: |
          go build ./...
          go vet ./...
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, build, test with coverage
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test -- --coverage

      - name: Skip (no package.json yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "No package.json in frontend/ yet — skipping."
