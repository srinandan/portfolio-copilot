name: Vertex AI Nightly Integration

on:
  schedule:
    - cron: '0 4 * * *'  # Run daily at 04:00 UTC
  workflow_dispatch:

jobs:
  test-vertex-sessions:
    name: Test Vertex AI Sessions & Revocation Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --project orchestrator

      - name: Run Vertex AI integration tests
        env:
          PYTHONPATH: orchestrator
          AGENT_ENGINE_ID: ${{ secrets.AGENT_ENGINE_ID }}
          RUN_INTEGRATION_TESTS: ${{ secrets.AGENT_ENGINE_ID != '' && '1' || '0' }}
        run: |
          if [ -n "$AGENT_ENGINE_ID" ]; then
            uv run --project orchestrator pytest orchestrator/tests/integration/test_vertex_ai_sessions.py -v
          else
            echo "::warning title=Vertex AI Nightly Skipped::AGENT_ENGINE_ID secret not set; skipping live integration tests."
            uv run --project orchestrator pytest orchestrator/tests/integration/test_vertex_ai_sessions.py -v
          fi
