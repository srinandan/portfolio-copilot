[project]
name = "orchestrator"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "fastapi>=0.141.1",
    "google-adk[a2a,agent-identity]>=2.12.0",
    "google-auth>=2.62.0",
    "google-cloud-aiplatform>=2.5.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-modelarmor>=0.7.2",
    "google-cloud-secret-manager>=2.31.0",
    "httpx>=0.28.1",
    "mcp<2",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", ".."]
testpaths = ["tests"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F841", "E701", "E741", "BLE001", "EXE001", "C408"]

