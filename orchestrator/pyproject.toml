[project]
name = "orchestrator"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30.0",
    "fastapi>=0.115.0",
    "google-adk[a2a,agent-identity,eval]>=2.8.0",
    "google-auth>=2.0.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-secret-manager>=2.20.0",
    "httpx>=0.28.1",
    "mcp<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "pydantic>=2.13.4",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", ".."]
testpaths = ["tests"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F841", "E701", "E741", "BLE001", "EXE001", "C408"]

