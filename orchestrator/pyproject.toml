[project]
name = "orchestrator"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.45.0",
    "fastapi>=0.165.0",
    "google-adk[a2a,agent-identity]>=2.15.0",
    "google-auth>=2.63.1",
    "google-cloud-aiplatform>=2.10.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-modelarmor>=0.7.5",
    "google-cloud-secret-manager>=2.32.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", ".."]
testpaths = ["tests"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F841", "E701", "E741", "BLE001", "EXE001", "C408"]

