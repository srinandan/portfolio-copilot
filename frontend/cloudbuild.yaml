substitutions:
  _COMMIT_SHA: latest
  _REGION: us-central1
  _SERVICE: portfolio-copilot-frontend
  _GATEWAY_SERVICE: portfolio-copilot-gateway
  _AR_REPO: portfolio-copilot

steps:
  # Build the container image, tagged with the commit SHA / git tag.
  # Build context is the repo root because the frontend Dockerfile now copies
  # go.mod / go.sum + ./frontend/server (the Go static-file host + authed
  # proxy binary that replaced the nginx runtime stage).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # Push both tags to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}'

  # Deploy the versioned image to Cloud Run.
  # GATEWAY_URL is looked up at deploy time so we don't have to hardcode the
  # project-number-embedded hostname. The frontend Go proxy uses this URL as
  # both the reverse-proxy target and the ID-token audience.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        GATEWAY_URL=$(gcloud run services describe ${_GATEWAY_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        if [ -z "$${GATEWAY_URL}" ]; then
          echo "Could not resolve URL for ${_GATEWAY_SERVICE} in ${_REGION}" >&2
          exit 1
        fi
        echo "Deploying ${_SERVICE} with GATEWAY_URL=$${GATEWAY_URL}"
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA} \
          --region=${_REGION} \
          --service-account=portfolio-copilot-frontend-sa@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars=GATEWAY_URL=$${GATEWAY_URL} \
          --labels=app=portfolio-copilot,component=frontend,commit=${_COMMIT_SHA} \
          --no-allow-unauthenticated

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
