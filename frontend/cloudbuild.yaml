substitutions:
  _COMMIT_SHA: latest
  _REGION: us-central1
  _SERVICE: portfolio-copilot-frontend
  _AR_REPO: portfolio-copilot
  _AGENT_DISPLAY_NAME: portfolio-copilot-agent
  _DOCUMENT_AI_PROCESSOR_ID: ""
  _DOCUMENT_AI_LOCATION: "us"

steps:
  # Build the unified container image (Vue SPA + Go backend server)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}'

  # Deploy unified web service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        if ! command -v jq &>/dev/null; then
          curl -L -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux64 && \
            chmod +x /usr/local/bin/jq
        fi
        TOKEN=$(gcloud auth print-access-token)
        AGENT_ENGINE_ID=$(curl -s -H "Authorization: Bearer $${TOKEN}" \
          "https://${_REGION}-aiplatform.googleapis.com/v1beta1/projects/${PROJECT_ID}/locations/${_REGION}/reasoningEngines" \
          | jq -r --arg name "${_AGENT_DISPLAY_NAME}" '.reasoningEngines[]? | select(.displayName == $name) | .name // empty' \
          | head -n1 || echo "")

        DOCUMENT_AI_PROCESSOR_ID="${_DOCUMENT_AI_PROCESSOR_ID}"
        if [ -z "$${DOCUMENT_AI_PROCESSOR_ID}" ]; then
          DOCUMENT_AI_PROCESSOR_ID=$(curl -s -H "Authorization: Bearer $${TOKEN}" \
            "https://${_DOCUMENT_AI_LOCATION}-documentai.googleapis.com/v1/projects/${PROJECT_ID}/locations/${_DOCUMENT_AI_LOCATION}/processors" \
            | jq -r '.processors[]? | select(.type == "FORM_W2_PROCESSOR" and .state == "ENABLED") | .name // empty' \
            | head -n1 | awk -F'/' '{print $$NF}' || echo "")
        fi

        DEPLOY_ARGS=(
          run deploy ${_SERVICE}
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA}
          --region=${_REGION}
          --service-account=portfolio-copilot-frontend-sa@${PROJECT_ID}.iam.gserviceaccount.com
          --labels=app=portfolio-copilot,component=frontend,commit=${_COMMIT_SHA}
          --timeout=600
          --no-allow-unauthenticated
        )

        ENV_VARS="PROJECT_ID=${PROJECT_ID},FIRESTORE_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},OTEL_SERVICE_NAME=portfolio-copilot-frontend"
        if [ -n "$${AGENT_ENGINE_ID}" ]; then
          echo "Deploying ${_SERVICE} with AGENT_ENGINE_ID=$${AGENT_ENGINE_ID}"
          ENV_VARS="$${ENV_VARS},AGENT_ENGINE_ID=$${AGENT_ENGINE_ID}"
        else
          echo "WARN: no Agent Engine found with displayName=${_AGENT_DISPLAY_NAME} in ${_REGION};"
          echo "      /api/plan will return 503 until an orchestrator is deployed."
        fi
        if [ -n "$${DOCUMENT_AI_PROCESSOR_ID}" ]; then
          echo "Deploying ${_SERVICE} with DOCUMENT_AI_PROCESSOR_ID=$${DOCUMENT_AI_PROCESSOR_ID} (location: ${_DOCUMENT_AI_LOCATION})"
          ENV_VARS="$${ENV_VARS},DOCUMENT_AI_PROCESSOR_ID=$${DOCUMENT_AI_PROCESSOR_ID},DOCUMENT_AI_LOCATION=${_DOCUMENT_AI_LOCATION}"
        fi
        DEPLOY_ARGS+=(--set-env-vars="$${ENV_VARS}")

        gcloud "$${DEPLOY_ARGS[@]}"

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${_COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
