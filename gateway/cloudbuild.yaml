steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/portfolio-copilot-gateway', '-f', 'gateway/Dockerfile', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/portfolio-copilot-gateway']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-copilot-gateway'
      - '--image'
      - 'gcr.io/$PROJECT_ID/portfolio-copilot-gateway'
      - '--region'
      - 'us-central1'
      - '--set-labels=app=portfolio-copilot,component=gateway'
      - '--no-allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/portfolio-copilot-gateway'
